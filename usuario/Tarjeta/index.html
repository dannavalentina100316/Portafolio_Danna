<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tarjeta Random User</title>

    <link rel="stylesheet" href="styles.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <main class="card">

  
        <div class="card-header">

            <div class="profile">
                <img id="foto" src="" alt="Foto de usuario">
            </div>

        </div>

      
        <div class="card-content">

            <span class="label">PRESENTACIÓN</span>

            <h1 id="nombre">Cargando...</h1>

            <p class="profession" id="profesion">
                Usuario Random
            </p>

            <p class="description">
                Esta tarjeta obtiene automáticamente
                información de una persona utilizando
                Random User API.
            </p>


            <div class="datos">

                <div class="dato">
                    <div class="icon">
                        <i class="fa-solid fa-envelope"></i>
                    </div>

                    <div>
                        <small>Correo</small>
                        <p id="correo">Cargando...</p>
                    </div>
                </div>

                <div class="dato">
                    <div class="icon">
                        <i class="fa-solid fa-phone"></i>
                    </div>

                    <div>
                        <small>Teléfono</small>
                        <p id="telefono">Cargando...</p>
                    </div>
                </div>

                <div class="dato">
                    <div class="icon">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>

                    <div>
                        <small>Ubicación</small>
                        <p id="ubicacion">Cargando...</p>
                    </div>
                </div>

                <div class="dato">
                    <div class="icon">
                        <i class="fa-solid fa-earth-americas"></i>
                    </div>

                    <div>
                        <small>País</small>
                        <p id="pais">Cargando...</p>
                    </div>
                </div>

            </div>

        </div>

        <div class="footer">

            <span>
                <i class="fa-solid fa-rotate"></i>
                Recarga la página para cambiar de persona
            </span>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
